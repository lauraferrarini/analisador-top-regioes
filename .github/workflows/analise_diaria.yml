name: Analisador Diário de Músicas

on:
  schedule:
    # Roda às 11:30 UTC (08:30 no Horário de Brasília) para o Brasil
    - cron: '30 09 * * *'
    # Roda às 13:11 UTC (10:11 no Horário de Brasília) para as outras regiões
    - cron: '30 09 * * *'
  workflow_dispatch:
    # Adicionamos uma opção para você escolher o que rodar se apertar o botão manual
    inputs:
      regiao:
        description: 'Qual bloco processar? (all, br, latam, ou uma região específica: br, kr, ar, co, sp, es, mx)'
        required: true
        default: 'all'

jobs:
  analisar_dados:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # ⚡ Impede que duas execuções rodem ao mesmo tempo (ex: você dispara manual
    # enquanto o agendado ainda está rodando). Sem isso, as duas tentam commitar
    # e dar push nos mesmos arquivos quase junto, o que pode gerar disputa no
    # git. Com isso, a segunda execução espera a primeira terminar e roda
    # depois — sempre sobrescrevendo por cima do que a anterior salvou, nunca
    # em paralelo. "cancel-in-progress: false" garante que nenhuma execução é
    # cancelada, só fica na fila.
    concurrency:
      group: analisador-diario
      cancel-in-progress: false

    # ⚡ FORÇA O SERVIDOR DO GITHUB A USAR O HORÁRIO DO BRASIL
    env:
      TZ: "America/Sao_Paulo"

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Definir Alvo da Análise
        id: set_target
        run: |
          # Checa qual foi o gatilho que iniciou o robô e define o alvo
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "TARGET=${{ github.event.inputs.regiao }}" >> $GITHUB_ENV
          elif [[ "${{ github.event.schedule }}" == "30 11 * * *" ]]; then
            echo "TARGET=br" >> $GITHUB_ENV
          elif [[ "${{ github.event.schedule }}" == "11 13 * * *" ]]; then
            echo "TARGET=latam" >> $GITHUB_ENV
          else
            echo "TARGET=all" >> $GITHUB_ENV
          fi

      - name: Verificar se já rodou hoje (trava contra rodada manual)
        id: check_ja_rodou
        run: |
          # ⚡ Se você já processou o dia de hoje na mão (subindo os arquivos
          # coletados pela extensão via "Add files via upload", por exemplo,
          # depois de um scrape automático ter vindo errado), esse robô não
          # deve rodar sozinho no horário programado e pisar em cima do que
          # você já corrigiu. Só vale pra disparo AGENDADO — se você aperta
          # "Run workflow" na mão, sempre roda, sem essa trava (é o seu botão
          # de forçar).
          HOJE=$(date +%F)

          case "${{ env.TARGET }}" in
            br) REGIOES="br" ;;
            latam) REGIOES="ar co sp es mx" ;;
            all) REGIOES="br kr ar co sp es mx" ;;
            *) REGIOES="${{ env.TARGET }}" ;;
          esac

          PULAR=false
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            TODAS_JA_EXISTEM=true
            for r in $REGIOES; do
              if [[ ! -f "historico_dados/$r/dados_${HOJE}.json" ]]; then
                TODAS_JA_EXISTEM=false
                break
              fi
            done
            if [[ "$TODAS_JA_EXISTEM" == "true" ]]; then
              PULAR=true
            fi
          fi

          echo "PULAR=$PULAR" >> $GITHUB_ENV
          if [[ "$PULAR" == "true" ]]; then
            echo "⏭️  Dia $HOJE já tem dados pra [$REGIOES] (rodada manual anterior). Pulando a rodada agendada."
          else
            echo "▶️  Seguindo com a rodada normal pra [$REGIOES]."
          fi

      - name: Rodar script de análise
        # Repassa o alvo (br, latam ou all) para o Python, e o User-Agent
        # via secret (Settings → Secrets and variables → Actions) — nunca
        # fica em texto puro no código nem aparece nos logs da run.
        if: env.PULAR != 'true'
        env:
          SCRAPER_USER_AGENT: ${{ secrets.SCRAPER_USER_AGENT }}
        run: python analisador.py ${{ env.TARGET }}

      - name: Salvar alterações no GitHub (Git Puro)
        if: env.PULAR != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Mapeia todas as subpastas e os arquivos dinâmicos de cada região (*.md e *.json)
          git add historico_dados/ historico_relatorios/ relatorio_diario_*.md dados_dashboard_*.json || true
          
          if ! git diff --cached --quiet; then
            git commit -m "📊 Histórico, relatórios e dados do painel updated (${{ env.TARGET }})"

            # -X theirs aqui favorece o commit desta execução (é assim que o rebase
            # trata "theirs" durante um pull --rebase) sobre o que já estiver no
            # remoto — ou seja, a run mais recente sempre sobrescreve a anterior
            # pro mesmo dia. Repetimos algumas vezes por segurança, caso o push
            # perca uma corrida rara contra outro commit que chegou entre o pull
            # e o push.
            tentativa=1
            ate_tentativas=5
            while true; do
              git pull origin main --rebase -X theirs
              if git push origin main; then
                break
              fi
              if [ "$tentativa" -ge "$ate_tentativas" ]; then
                echo "❌ Não consegui dar push depois de $ate_tentativas tentativas."
                exit 1
              fi
              echo "⚠️ Push falhou (tentativa $tentativa/$ate_tentativas), tentando de novo..."
              tentativa=$((tentativa+1))
              sleep 5
            done
          else
            echo "Nenhuma mudança nos dados estruturados detectada hoje."
          fi
