name: Analisador Diário de Músicas

on:
  schedule:
    # ⏰ A primeira rodada do dia é às 09:27 (Horário de Brasília), e depois roda de
    # hora em hora (10:27, 11:27...) até 21:27 — a última antes das 22h.
    # (UTC: 12:27 às 23:27 + 00:27 do dia seguinte.)
    # A cada hora o robô só mexe no que ainda estiver "pendente": região sem dados
    # de hoje, ou com dados IGUAIS aos de ontem (o site às vezes demora a
    # atualizar a lista). Quando tudo já estiver atualizado, as rodadas seguintes
    # terminam em segundos sem fazer nada. A partir das 22h BRT não roda mais.
    - cron: '27 12-23 * * *'
    - cron: '27 0 * * *'
  workflow_dispatch:
    # Adicionamos uma opção para você escolher o que rodar se apertar o botão manual
    inputs:
      regiao:
        description: 'Qual bloco processar? (all, pendentes, br, latam, ou uma região específica: br, kr, ar, co, sp, es, mx)'
        required: true
        default: 'all'

jobs:
  analisar_dados:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # ⚡ Impede que duas execuções rodem ao mesmo tempo (ex: você dispara manual
    # enquanto o agendado ainda está rodando). Sem isso, as duas tentam commitar
    # e dar push nos mesmos arquivos quase junto, o que pode gerar disputa no
    # git. Com isso, a segunda execução espera a primeira terminar e roda
    # depois — sempre sobrescrevendo por cima do que a anterior salvou, nunca
    # em paralelo. "cancel-in-progress: false" garante que nenhuma execução é
    # cancelada, só fica na fila.
    concurrency:
      group: analisador-diario
      cancel-in-progress: false

    # ⚡ FORÇA O SERVIDOR DO GITHUB A USAR O HORÁRIO DO BRASIL
    env:
      TZ: "America/Sao_Paulo"

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Definir Alvo da Análise
        id: set_target
        run: |
          # Manual ("Run workflow"): usa o que você escolheu (all força tudo).
          # Agendado: só as regiões pendentes (sem dados de hoje ou iguais às de ontem).
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "TARGET=${{ github.event.inputs.regiao }}" >> $GITHUB_ENV
          else
            echo "TARGET=pendentes" >> $GITHUB_ENV
          fi

      - name: Verificar se vale rodar agora (trava)
        id: check_ja_rodou
        run: |
          # ⚡ Só vale pra disparo AGENDADO. Se você aperta "Run workflow" na mão,
          # sempre roda (é o seu botão de forçar).
          #
          # No agendado, o robô roda de hora em hora e pula quando:
          #   1) está fora da janela das 09h às 22h (Horário de Brasília) — a partir das
          #      22h não tenta mais; ou
          #   2) NÃO há nenhuma região pendente. "Pendente" = sem dados de hoje, ou
          #      com dados idênticos aos de ontem (site ainda não atualizou).
          #      Região que você subiu na mão com dados diferentes dos de ontem
          #      conta como resolvida e não é tocada.
          PULAR=false
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            HORA=$((10#$(date +%H)))
            if (( HORA >= 22 || HORA < 9 )); then
              PULAR=true
              echo "⏭️  Fora da janela de tentativas (09h às 21h59 de Brasília; agora: ${HORA}h)."
            else
              PENDENTES=$(python analisador.py listar-pendentes)
              if [[ -z "$PENDENTES" ]]; then
                PULAR=true
                echo "⏭️  Todas as regiões já têm dados de hoje diferentes dos de ontem. Nada a fazer."
              else
                echo "▶️  Regiões pendentes: $PENDENTES"
              fi
            fi
          else
            echo "▶️  Rodada manual: $TARGET"
          fi

          echo "PULAR=$PULAR" >> $GITHUB_ENV

      - name: Rodar script de análise
        # Repassa o alvo (pendentes, br, latam, all...) para o Python, e o User-Agent
        # via secret (Settings → Secrets and variables → Actions) — nunca
        # fica em texto puro no código nem aparece nos logs da run.
        if: env.PULAR != 'true'
        env:
          SCRAPER_USER_AGENT: ${{ secrets.SCRAPER_USER_AGENT }}
        run: python analisador.py ${{ env.TARGET }}

      - name: Salvar alterações no GitHub (Git Puro)
        # !cancelled(): salva mesmo se alguma região falhou (o job fica vermelho,
        # mas as regiões que deram certo não se perdem)
        if: ${{ !cancelled() && env.PULAR != 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Mapeia todas as subpastas e os arquivos dinâmicos de cada região (*.md e *.json)
          git add historico_dados/ historico_relatorios/ relatorio_diario_*.md dados_dashboard_*.json || true
          
          if ! git diff --cached --quiet; then
            git commit -m "📊 Histórico, relatórios e dados do painel updated (${{ env.TARGET }})"

            # -X theirs aqui favorece o commit desta execução (é assim que o rebase
            # trata "theirs" durante um pull --rebase) sobre o que já estiver no
            # remoto — ou seja, a run mais recente sempre sobrescreve a anterior
            # pro mesmo dia. Repetimos algumas vezes por segurança, caso o push
            # perca uma corrida rara contra outro commit que chegou entre o pull
            # e o push.
            tentativa=1
            ate_tentativas=5
            while true; do
              git pull origin main --rebase -X theirs
              if git push origin main; then
                break
              fi
              if [ "$tentativa" -ge "$ate_tentativas" ]; then
                echo "❌ Não consegui dar push depois de $ate_tentativas tentativas."
                exit 1
              fi
              echo "⚠️ Push falhou (tentativa $tentativa/$ate_tentativas), tentando de novo..."
              tentativa=$((tentativa+1))
              sleep 5
            done
          else
            echo "Nenhuma mudança nos dados estruturados detectada hoje."
          fi
